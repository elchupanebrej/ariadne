name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Supply-chain gate: blocks PRs introducing moderate+ vulnerabilities
  # ──────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependency Review
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
        with:
          fail-on-severity: moderate

  # ──────────────────────────────────────────────────────────────────────────
  # Four-platform release-blocking CI matrix plus a non-blocking Node 26
  # early-warning lane. Node 26 is intentionally outside the production
  # engine and authoritative benchmark contracts until its LTS support is
  # explicitly adopted.
  # ──────────────────────────────────────────────────────────────────────────
  ci:
    name: CI / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            name: linux-x64-node22
            experimental: false
          - os: ubuntu-latest
            node: '24'
            name: linux-x64-node24
            experimental: false
          - os: windows-latest
            node: '24'
            name: windows-x64-node24
            experimental: false
          - os: macos-latest
            node: '24'
            name: macos-arm64-node24
            experimental: false
          - os: ubuntu-latest
            node: '26'
            name: linux-x64-node26-early-warning
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Documentation tests
        run: npm run docs:test
        continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}

      - name: Pack smoke (tarball zero-leakage check)
        if: matrix.name == 'linux-x64-node24'
        run: npm run pack:smoke

  # ──────────────────────────────────────────────────────────────────────────
  # 10K ceiling benchmark — authoritative Linux Node 22 and 24 corpus,
  # runs after the platform matrix passes
  # ──────────────────────────────────────────────────────────────────────────
  benchmark:
    name: Benchmark / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs: ci
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.23.0'
            name: linux-x64-node22
          - node: '24.17.0'
            name: linux-x64-node24
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run authoritative 10K ceiling corpus
        run: npm run benchmark:corpus

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EVD-BENCH-PASS-node${{ matrix.node }}
          path: benchmark-evidence/**
          if-no-files-found: error

      - name: Generate CI pass evidence
        run: node scripts/write-benchmark-ci-evidence.mjs

      - name: Upload CI pass evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: EVD-CI-PASS-node${{ matrix.node }}
          path: EVD-CI-PASS.json
          if-no-files-found: error
