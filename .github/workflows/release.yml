name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create GitHub Release and upload assets
  id-token: write   # OIDC trusted publishing (npm publish --provenance)
  packages: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # verify — pre-flight checks before publishing
  # ────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Version parity check
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Git tag version : $TAG"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch — git tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version parity confirmed: $PKG_VERSION"

      - name: CHANGELOG check
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found. Please add release notes for v$VERSION before tagging."
            exit 1
          fi
          if ! grep -qF "$VERSION" CHANGELOG.md; then
            echo "::error::Version $VERSION not found in CHANGELOG.md. Please document release notes before tagging."
            exit 1
          fi
          echo "CHANGELOG.md contains release notes for $VERSION"

      - name: Type check
        run: npm run typecheck

      - name: Pack smoke (tarball zero-leakage check)
        run: npm run pack:smoke

      - name: Test
        run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # publish — build and publish to npm with OIDC provenance
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Poll npm registry until package is available
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Polling npm registry for ariadne-reasoning@$VERSION (up to 255s)..."
          FOUND=false
          for DELAY in 1 2 4 8 16 32 64 128; do
            if npm view "ariadne-reasoning@$VERSION" version 2>/dev/null | grep -q "$VERSION"; then
              echo "Package ariadne-reasoning@$VERSION is available on npm!"
              FOUND=true
              break
            fi
            echo "Not yet available. Waiting ${DELAY}s..."
            sleep $DELAY
          done
          if [ "$FOUND" != "true" ]; then
            echo "::error::Package ariadne-reasoning@$VERSION did not appear on npm within 255s."
            exit 1
          fi

      - name: Verify dist-tag points to new version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking dist-tags for ariadne-reasoning..."
          npm dist-tag ls ariadne-reasoning
          LATEST=$(npm dist-tag ls ariadne-reasoning | grep '^latest:' | awk '{print $2}')
          echo "latest dist-tag: $LATEST"
          if [ "$LATEST" != "$VERSION" ]; then
            echo "::error::dist-tag 'latest' is '$LATEST', expected '$VERSION'"
            exit 1
          fi
          echo "dist-tag 'latest' correctly points to $VERSION"

      - name: CLI smoke test (npx ariadne-reasoning --version)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Running: npx --yes ariadne-reasoning@$VERSION --version"
          OUTPUT=$(npx --yes "ariadne-reasoning@$VERSION" --version 2>&1 || true)
          echo "Output: $OUTPUT"
          if ! echo "$OUTPUT" | grep -q "$VERSION"; then
            echo "::error::CLI smoke test failed — output did not contain '$VERSION'. Got: $OUTPUT"
            exit 1
          fi
          echo "CLI smoke test passed"

      - name: Signature verification (npm audit signatures)
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TMPDIR=$(mktemp -d)
          echo "Installing ariadne-reasoning@$VERSION in ephemeral consumer dir: $TMPDIR"
          cd "$TMPDIR"
          npm init -y
          npm install "ariadne-reasoning@$VERSION"
          echo "Running npm audit signatures..."
          npm audit signatures
          echo "Signature verification passed"

  # ────────────────────────────────────────────────────────────────────────────
  # evidence — assemble Release Evidence Bundle and create GitHub Release
  # ────────────────────────────────────────────────────────────────────────────
  evidence:
    name: Evidence
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download benchmark evidence (if available)
        uses: actions/download-artifact@v4
        with:
          name: EVD-BENCH-PASS
          path: .
        continue-on-error: true

      - name: Generate EVD-PROVENANCE.json
        shell: bash
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{\n  "tag": "%s",\n  "commit": "%s",\n  "timestamp": "%s",\n  "workflow": "%s",\n  "run_id": "%s"\n}\n' \
            "${{ github.ref_name }}" \
            "${{ github.sha }}" \
            "$TIMESTAMP" \
            "${{ github.workflow }}" \
            "${{ github.run_id }}" > EVD-PROVENANCE.json
          echo "Generated EVD-PROVENANCE.json:"
          cat EVD-PROVENANCE.json

      - name: Generate tarball digest
        shell: bash
        run: |
          npm run build
          TARBALL=$(npm pack 2>/dev/null | tail -1)
          echo "Packed tarball: $TARBALL"
          sha256sum "$TARBALL" > tarball-digest.sha256
          echo "Digest:"
          cat tarball-digest.sha256

      - name: Generate EVD-CI-PASS.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf '{\n  "timestamp": "%s",\n  "tag": "v%s",\n  "all_passed": true\n}\n' \
            "$TIMESTAMP" "$VERSION" > EVD-CI-PASS.json
          echo "Generated EVD-CI-PASS.json:"
          cat EVD-CI-PASS.json

      - name: Upload release evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            tarball-digest.sha256
            EVD-CI-PASS.json
            EVD-BENCH-PASS.json
            EVD-PROVENANCE.json
            CHANGELOG.md
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: "Release ${{ github.ref_name }}. See CHANGELOG.md for details."
          files: |
            tarball-digest.sha256
            EVD-CI-PASS.json
            EVD-BENCH-PASS.json
            EVD-PROVENANCE.json
            CHANGELOG.md
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
