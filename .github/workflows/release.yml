name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # verify — repository-wide pre-publication checks
  # ────────────────────────────────────────────────────────────────────────────
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Version parity check
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Git tag version : $TAG"
          echo "package.json version: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch — git tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Version parity confirmed: $PKG_VERSION"

      - name: Required release notes
        run: |
          mkdir -p release-evidence
          npm run release:check-notes -- --output release-evidence/RELEASE-NOTES.md

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Test
        run: npm test

      - name: Tarball and clean-consumer gates
        run: npm run pack:smoke

  benchmark:
    name: Benchmark / ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.23.0'
            name: node22
          - node: '24.17.0'
            name: node24

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run authoritative benchmark corpus
        run: npm run benchmark:corpus

      - name: Shape benchmark evidence for the release bundle
        run: |
          mkdir -p "release-evidence/benchmark-${{ matrix.name }}"
          cp benchmark-evidence/*.json "release-evidence/benchmark-${{ matrix.name }}/"
          node scripts/write-benchmark-ci-evidence.mjs \
            --output "release-evidence/benchmark-${{ matrix.name }}/EVD-CI-PASS-${{ matrix.name }}.json"

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-benchmark-${{ matrix.name }}
          path: release-evidence
          if-no-files-found: error

  preflight:
    name: Assemble pre-publication evidence
    needs: [verify, benchmark]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download benchmark evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-benchmark-*
          path: release-evidence
          merge-multiple: true

      - name: Re-check release notes and build the release tarball
        shell: bash
        run: |
          npm run release:check-notes -- --output release-evidence/RELEASE-NOTES.md
          cp CHANGELOG.md release-evidence/CHANGELOG.md
          npm run build
          TARBALL=$(npm pack --pack-destination release-evidence 2>/dev/null | tail -n 1)
          echo "TARBALL=release-evidence/$TARBALL" >> "$GITHUB_ENV"

      - name: Validate tarball allowlist and preflight evidence
        run: |
          npm run release:preflight-evidence -- \
            --tarball "$TARBALL" \
            --benchmark-summary release-evidence/benchmark-node22/EVD-BENCH-SUMMARY.json \
            --benchmark-summary release-evidence/benchmark-node24/EVD-BENCH-SUMMARY.json \
            --output release-evidence/EVD-RELEASE-PRE.json

      - name: Upload preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-preflight
          path: release-evidence
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # publish — build and publish to npm with OIDC provenance
  # ────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm with OIDC provenance
        run: npm publish --provenance --access public

      - name: Verify registry, dist-tag, CLI, and signatures
        run: |
          mkdir -p release-evidence
          npm run release:postcheck -- --output release-evidence/EVD-RELEASE-POST.json

      - name: Upload post-publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-postpublication
          path: release-evidence/EVD-RELEASE-POST.json
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────────────────
  # evidence — assemble Release Evidence Bundle and create GitHub Release
  # ────────────────────────────────────────────────────────────────────────────
  evidence:
    name: Evidence
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Download preflight and post-publication evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release-evidence
          merge-multiple: true

      - name: Generate EVD-PROVENANCE.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_WORKFLOW: ${{ github.workflow }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module -e '
            import { writeFile } from "node:fs/promises";
            await writeFile("release-evidence/EVD-PROVENANCE.json", `${JSON.stringify({
              schemaVersion: 1,
              kind: "release-provenance",
              tag: process.env.RELEASE_TAG,
              commit: process.env.RELEASE_COMMIT,
              workflow: process.env.RELEASE_WORKFLOW,
              runId: process.env.RELEASE_RUN_ID,
              timestamp: new Date().toISOString(),
            }, null, 2)}\n`);
          '

      - name: Generate tarball digest
        run: |
          sha256sum release-evidence/*.tgz > release-evidence/tarball-digest.sha256

      - name: Assemble complete reproducible release evidence
        run: npm run release:evidence -- --input release-evidence --output release-evidence/EVD-RELEASE.json

      - name: Upload release evidence artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.ref_name }}
          path: release-evidence
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: ${{ github.ref_name }}
          body_path: release-evidence/RELEASE-NOTES.md
          files: |
            release-evidence/EVD-RELEASE.json
            release-evidence/EVD-RELEASE-PRE.json
            release-evidence/EVD-RELEASE-POST.json
            release-evidence/EVD-PROVENANCE.json
            release-evidence/RELEASE-NOTES.md
            release-evidence/CHANGELOG.md
            release-evidence/tarball-digest.sha256
            release-evidence/*.tgz
            release-evidence/benchmark-node22/EVD-CI-PASS-node22.json
            release-evidence/benchmark-node22/EVD-BENCH-PASS-*.json
            release-evidence/benchmark-node22/EVD-BENCH-SUMMARY.json
            release-evidence/benchmark-node24/EVD-CI-PASS-node24.json
            release-evidence/benchmark-node24/EVD-BENCH-PASS-*.json
            release-evidence/benchmark-node24/EVD-BENCH-SUMMARY.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
